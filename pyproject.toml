[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honeypot-detector"
version = "0.2.0"
description = "Heuristic honeypot scanner targeting protocol quirks and broken emulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Dan K."}
]
dependencies = [
    "scapy>=2.5.0",
    "netaddr>=0.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
hpdetect = "honeypot_detector.cli:main"
honeypot-detector = "honeypot_detector.cli:main"

[tool.setuptools.packages.find]
where = ["."]
